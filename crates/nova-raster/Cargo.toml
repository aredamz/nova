[package]
name = "nova-raster"
description = "NOVA raster backends: FramePlan -> RGBA pixels. Ships the Skia CPU backend."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
nova-core.workspace = true
resvg = "0.50.0"
skia-safe = { version = "0.157.0", features = ["textlayout"] }

[dev-dependencies]
nova-template = { path = "../nova-template" }
serde_json.workspace = true
tempfile = "3.27.0"

[lints]
workspace = true
